<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10Store - WebStore</title>
<style>
:root {
  --accent: #0078D7;
  --accent-hover: #005A9E;
  --bg-color: #111111;
  --header-bg: #1A1A1A;
  --tile-bg: #1e1e1e;
  --tile-hover: #282828;
  --text-main: #ffffff;
  --text-muted: #9e9e9e;
  --modal-bg: #141414;
  --tile-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
  --tile-shadow-hover: 0 12px 30px rgba(0, 0, 0, 0.85);
}

[data-theme="light"] {
  --bg-color: #f4f4f4;
  --header-bg: #e5e5e5;
  --tile-bg: #ffffff;
  --tile-hover: #f9f9f9;
  --text-main: #111111;
  --text-muted: #666666;
  --modal-bg: #ffffff;
  --tile-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  --tile-shadow-hover: 0 12px 28px rgba(0, 0, 0, 0.35);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  font-family: "Segoe UI Light", "Segoe UI", Tahoma, Arial, sans-serif;
  font-weight: 300;
}

body {
  color: var(--text-main);
  background: var(--bg-color);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }

#Header {
  background: var(--header-bg);
  height: 80px;
  display: flex;
  align-items: center;
  padding: 0 40px;
  color: var(--text-main);
  flex-shrink: 0;
  transition: background 0.2s;
}

#HeaderLogo {
  font-size: 26px;
  color: var(--text-main);
  letter-spacing: 1px;
  cursor: pointer;
}

.nav-tabs {
  display: flex;
  gap: 20px;
  margin-left: 40px;
}

.nav-tab {
  font-size: 20px;
  color: var(--text-muted);
  cursor: pointer;
  padding-bottom: 4px;
  transition: color 0.2s, border-bottom 0.2s;
}

.nav-tab.active, .nav-tab:hover {
  color: var(--text-main);
  border-bottom: 3px solid var(--accent);
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 15px;
}

.search-container {
  position: relative;
  display: inline-flex;
  align-items: center;
  width: 280px;
  height: 36px;
  background-color: #ffffff !important;
  border: 1px solid #8a8a8a !important;
  box-sizing: border-box;
}

.search-container:focus-within {
  border-color: #0067b8 !important;
}

.search-input {
  width: 100%;
  height: 100%;
  padding: 0 40px 0 12px;
  border: none !important;
  background: transparent !important;
  color: #000000 !important;
  font-family: "Segoe UI Light", "Segoe UI", sans-serif;
  font-size: 16px;
  outline: none;
}

.search-input::placeholder {
  color: #262626 !important;
  opacity: 1;
  font-family: "Segoe UI Light", "Segoe UI", sans-serif;
}

.search-btn {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 38px;
  background: transparent !important;
  border: none !important;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
}

.search-icon-text {
  font-family: "Segoe MDL2 Assets", "Segoe UI Symbol", sans-serif;
  font-size: 16px;
  color: #333333;
  transition: color 0.1s ease;
}

.search-btn:hover .search-icon-text,
.search-container:focus-within .search-icon-text {
  color: #0067b8 !important;
}

.theme-btn {
  background: transparent;
  border: 1px solid var(--text-main);
  color: var(--text-main);
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.theme-btn:hover {
  background: var(--text-main);
  color: var(--bg-color);
}

#HorizontalContainer {
  width: 100vw;
  flex: 1;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 30px 40px 40px 40px;
  white-space: nowrap;
}

#HorizontalWrapper {
  display: inline-flex;
  gap: 45px;
  height: 100%;
}

.category-column {
  display: inline-flex;
  flex-direction: column;
  height: 100%;
}

.category-title {
  font-size: 22px;
  color: var(--text-main);
  margin-bottom: 16px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.app-tiles-grid {
  display: grid;
  grid-template-rows: repeat(2, 230px);
  grid-auto-flow: column;
  gap: 20px;
}

@media (max-height: 650px) {
  .app-tiles-grid {
    grid-template-rows: repeat(1, 230px);
  }
}

.app-tile {
  width: 160px;
  height: 230px;
  background: var(--tile-bg);
  padding: 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  white-space: normal;
  box-shadow: var(--tile-shadow);
  transition: background 0.15s ease, box-shadow 0.2s ease;
}

.app-tile:hover {
  background: var(--tile-hover);
  box-shadow: var(--tile-shadow-hover);
}

.app-tile:active { 
  transform: scale(0.97); 
}

.app-tile .icon-container {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  overflow: hidden;
  border-radius: 2px;
  margin-bottom: 8px;
}

.app-tile .icon-container img { 
  width: 100%; 
  height: 100%; 
  object-fit: cover; 
}

.app-tile .info {
  display: flex;
  flex-direction: column;
  flex: 1;
  justify-content: flex-start;
  overflow: hidden;
}

.app-tile .name {
  font-size: 14px;
  font-weight: 400;
  color: var(--text-main);
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 2px;
}

.app-tile .publisher { 
  font-size: 12px; 
  color: var(--text-muted); 
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: auto;
}

.app-tile .price { 
  font-size: 12px; 
  color: var(--text-muted); 
  font-weight: 400; 
  margin-top: 4px;
}

#Status { font-size: 18px; color: var(--text-muted); padding: 40px; }

#AppDetailModal {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: 1000;
  display: none;
  overflow-y: auto;
  background: var(--bg-color);
}

.modal-blur-bg {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-size: cover;
  background-position: center;
  filter: blur(90px) opacity(0.35);
  transform: scale(1.2);
  z-index: 0;
  pointer-events: none;
}

.modal-content {
  position: relative;
  z-index: 1;
  padding: 40px;
}

.text-back-btn {
  padding: 8px 22px;
  background: transparent;
  border: 1px solid var(--text-main);
  color: var(--text-main);
  font-size: 15px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s, color 0.2s, transform 0.1s;
}

.text-back-btn:hover { background: var(--text-main); color: var(--bg-color); }

.detail-layout { display: flex; flex-direction: column; gap: 30px; }

.detail-header-info { display: flex; gap: 30px; align-items: flex-start; }

.detail-icon {
  width: 110px; height: 110px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; color: #fff;
  flex-shrink: 0; overflow: hidden;
  border-radius: 2px;
}
.detail-icon img { width: 100%; height: 100%; object-fit: cover; }

.detail-info h1 { font-size: 34px; margin-bottom: 4px; }
.detail-publisher { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }
.detail-price { font-size: 18px; font-weight: 400; margin-bottom: 15px; }
.detail-subtext { font-size: 11px; color: var(--text-muted); margin-top: 8px; }

.download-btn {
  display: inline-block;
  padding: 10px 30px;
  background: #0078d7;
  color: #ffffff;
  font-size: 15px;
  border: none;
  cursor: pointer;
  transition: background 0.2s;
}

.download-btn:hover {
  background: #006cc2;
  color: #ffffff;
}

.detail-body-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
  margin-top: 20px;
}

.section-heading {
  font-size: 18px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 14px;
  color: var(--text-main);
}

.screenshots-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}

.screenshot-thumb {
  width: calc(50% - 8px);
  aspect-ratio: 16 / 9;
  border-radius: 2px;
  border: 1px solid #3d3d3d;
  object-fit: cover;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s;
}

.screenshot-thumb:hover {
  transform: scale(1.02);
  border-color: var(--accent);
}

.no-screenshots { font-size: 14px; color: var(--text-muted); font-style: italic; }

.detail-desc {
  line-height: 1.6;
  color: var(--text-main);
  font-size: 15px;
  white-space: pre-line;
}

.desc-toggle-btn {
  background: transparent;
  border: none;
  color: var(--accent);
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  padding: 0;
  margin-top: 8px;
  display: inline-block;
}

.desc-toggle-btn:hover {
  text-decoration: underline;
  color: var(--accent-hover);
}

.lightbox-modal {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(5px);
}

.lightbox-content {
  position: relative;
  z-index: 2001;
  max-width: 80vw;
  max-height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lightbox-content img {
  max-width: 100%;
  max-height: 80vh;
  object-fit: contain;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0, 0, 0, 0.6);
  border: none;
  color: #fff;
  font-size: 10px;
  width: 16px;
  height: 32px;
  cursor: pointer;
  z-index: 2002;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  font-family: "Segoe MDL2 Assets", "Segoe Fluent Icons", "Segoe UI Symbol", sans-serif;
}

.lightbox-nav.prev {
  left: 15px;
}

.lightbox-nav.next {
  right: 15px;
}

.lightbox-nav:hover {
  background: rgba(0, 0, 0, 0.85);
}

.lightbox-dots {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 2002;
}

.lightbox-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.4);
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}

.lightbox-dot.active {
  background: #ffffff;
  transform: scale(1.25);
}
</style>
</head>
<body data-theme="dark">

<div id="Header">
  <div id="HeaderLogo" onclick="resetToHome()">10Store</div>
  
  <div class="nav-tabs">
    <div class="nav-tab active">All</div>
  </div>

  <div class="header-right">
    <div class="search-container">
      <input id="Search" type="text" placeholder="Search" oninput="filterApps(this.value)" class="search-input" />
      <button class="search-btn" aria-label="Search">
        <span class="search-icon-text">&#xE721;</span>
      </button>
    </div>
    <button class="theme-btn" id="ThemeToggle" onclick="toggleTheme()">Light Mode</button>
  </div>
</div>

<div id="HorizontalContainer">
  <div id="Status">Loading apps...</div>
  <div id="HorizontalWrapper"></div>
</div>

<div id="AppDetailModal">
  <div id="ModalBlurBg" class="modal-blur-bg"></div>

  <div class="modal-content">

    <div class="detail-layout">
      <div class="detail-header-info">
        <div id="DetailIcon" class="detail-icon"></div>
        <div class="detail-info">
          <h1 id="DetailName">App Name</h1>
          <div id="DetailPublisher" class="detail-publisher">Publisher</div>
          <div class="detail-price">Free</div>
          <a id="DetailDownloadBtn" class="download-btn" href="#" target="_blank" download>Get the app</a>
          <div class="detail-subtext">May require certain hardware. See System Requirements for details.</div>
        </div>
      </div>

      <div class="detail-body-grid">
        <div class="screenshots-section">
          <div class="section-heading">Screenshots</div>
          <div id="ScreenshotsContainer" class="screenshots-grid"></div>
        </div>

        <div class="description-section">
          <div class="section-heading">Description</div>
          <div id="DetailDesc" class="detail-desc">No description available.</div>
          <button id="DetailDescToggleBtn" class="desc-toggle-btn" style="display: none;">More</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="ScreenshotLightbox" class="lightbox-modal" onclick="handleLightboxClick(event)">
  <button class="lightbox-nav prev" onclick="navigateLightbox(-1, event)">&#xE00E;</button>
  <button class="lightbox-nav next" onclick="navigateLightbox(1, event)">&#xE00F;</button>

  <div class="lightbox-content">
    <img id="LightboxImage" src="" alt="Screenshot view">
  </div>

  <div id="LightboxDots" class="lightbox-dots"></div>
</div>

<script src="index.js"></script>
</body>
</html>
